<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowZ" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14141c" />
