<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#08080c" />
    </radialGradient>
    <linearGradient id="plateBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#24242c" />
      <stop offset="40%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="edgeGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="meshPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#050507" stroke="#2a2a35" stroke-width="1.2" />
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGlow)" />

  <!-- Subtle Studio Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="750" x2="1200" y2="750" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
  </g>

  <!-- Number Plate Main Silhouette -->
  <g filter="url(#shadow)" transform="translate(320, 100)">
    <!-- Plate base shape -->
    <path d="M 60 40 
             L 500 40 
             C 530 40, 545 65, 540 95 
             L 480 580 
             C 475 620, 440 650, 400 650 
             L 160 650 
             C 120 650, 85 620, 80 580 
             L 20 95 
             C 15 65, 30 40, 60 40 Z" 
          fill="url(#plateBody)" 
          stroke="url(#edgeGleam)" 
          stroke-width="3" />

    <!-- Inset Bevel -->
    <path d="M 80 65 
             L 480 65 
             C 495 65, 505 80, 500 100 
             L 450 560 
             C 445 590, 420 615, 390 615 
             L 170 615 
             C 140 615, 115 590, 110 560 
             L 60 100 
             C 55 80, 65 65, 80 65 Z" 
          fill="#111116" 
          stroke="#2f303d" 
          stroke-width="1.5" />

    <!-- Upper Air Intake Mesh -->
    <rect x="180" y="90" width="200" height="35" rx="8" fill="url(#meshPattern)" stroke="#3a3b4c" stroke-width="2" />
    
    <!-- Central Air Intake Mesh Windows -->
    <g transform="translate(140, 150)">
      <polygon points="20,10 120,10 105,70 10,70" fill="url(#meshPattern)" stroke="#3a3b4c" stroke-width="1.8" />
      <polygon points="160,10 260,10 270,70 175,70" fill="url(#meshPattern)" stroke="#3a3b4c" stroke-width="1.8" />
    </g>

    <!-- Lower Side Vents -->
    <g transform="translate(130, 420)">
      <polygon points="15,0 75,0 60,40 5,40" fill="url(#meshPattern)" stroke="#3a3b4c" stroke-width="1.5" />
      <polygon points="245,0 305,0 315,40 260,40" fill="url(#meshPattern)" stroke="#3a3b4c" stroke-width="1.5" />
    </g>

    <!-- Zip-tie Mounting Slots -->
    <!-- Top Left -->
    <rect x="85" y="110" width="8" height="26" rx="4" fill="#000000" stroke="#4a4b5c" stroke-width="2" />
    <!-- Top Right -->
    <rect x="467" y="110" width="8" height="26" rx="4" fill="#000000" stroke="#4a4b5c" stroke-width="2" />
    <!-- Bottom Left -->
    <rect x="110" y="490" width="8" height="26" rx="4" fill="#000000" stroke="#4a4b5c" stroke-width="2" />
    <!-- Bottom Right -->
    <rect x="442" y="490" width="8" height="26" rx="4" fill="#000000" stroke="#4a4b5c" stroke-width="2" />

    <!-- Center Clean Plate Area (No stickers, pure satin black) -->
    <rect x="150" y="240" width="260" height="150" rx="14" fill="#14141b" stroke="#22222d" stroke-width="1.5" />
    <text x="280" y="305" fill="#444455" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="4">
      COLD CUSTOMS
    </text>
    <text x="280" y="335" fill="#303040" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">
      CLEAN BLACK EDITION · BEZ NAKLEJKI
    </text>
  </g>

  <!-- 4 Zip-ties representation on the right -->
  <g transform="translate(930, 200)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="420" rx="18" fill="#0f0f14" stroke="#232330" stroke-width="1.5" />
    <text x="90" y="38" fill="#a0a0b2" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
      W ZESTAWIE
    </text>
    <text x="90" y="58" fill="#505065" font-family="sans-serif" font-size="10" text-anchor="middle">
      4x Opaski zaciskowe
    </text>
    <line x1="20" y1="75" x2="160" y2="75" stroke="#232330" stroke-width="1" />

    <!-- Zip ties graphic -->
    <g transform="translate(45, 95)" stroke="#383848" stroke-width="4" stroke-linecap="round">
      <path d="M 0 0 L 0 260" />
      <rect x="-8" y="0" width="16" height="18" rx="3" fill="#1a1a24" stroke="#5a5a70" stroke-width="1.5" />
      
      <path d="M 30 0 L 30 260" />
      <rect x="22" y="0" width="16" height="18" rx="3" fill="#1a1a24" stroke="#5a5a70" stroke-width="1.5" />

      <path d="M 60 0 L 60 260" />
      <rect x="52" y="0" width="16" height="18" rx="3" fill="#1a1a24" stroke="#5a5a70" stroke-width="1.5" />

      <path d="M 90 0 L 90 260" />
      <rect x="82" y="0" width="16" height="18" rx="3" fill="#1a1a24" stroke="#5a5a70" stroke-width="1.5" />
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(600, 810)" text-anchor="middle">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#0d0d12" stroke="#252535" stroke-width="1.5" />
    <text y="7" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" letter-spacing="1">
      FRONT PLATE BEZ NAKLEJKI · <tspan fill="#34d399">149 ZŁ</tspan>
    </text>
  </g>
</svg>
